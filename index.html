<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Умная тетрадка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Neucha&family=Nunito:wght@400;700;900&display=swap">
<style>
/* Layout: страница школьной тетради в клетку с красными полями; игры — листки, вклеенные в тетрадь; котёнок живёт в своей комнате */
:root{
  --paper:#fbfcf7; --grid:#d6e2ef; --ink:#1f3a8a; --text:#1d2433; --muted:#5a6478;
  --margin:#e0525a; --star:#d99a00; --ok:#2e9e5b; --bad:#d64545; --card:#ffffff; --line:#c9d3e2; --me:#fff4c7;
  --common:#6f7f9c; --rare:#7a4fd6; --legend:#d99a00; --hard:#3b2a6b; --xp:#2fa6c9;
  --display:"Neucha","Comic Sans MS",cursive; --body:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141a26; --grid:#212b3d; --ink:#8fb0ff; --text:#e6ebf5; --muted:#9aa6bd;
  --margin:#ff7a80; --star:#ffc93c; --ok:#4fd18a; --bad:#ff7070; --card:#1b2333; --line:#2e3a52; --me:#3a3420;
  --common:#9aa8c4; --rare:#b394ff; --legend:#ffc93c; --hard:#8f7ad9; --xp:#5fd0f0; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141a26; --grid:#212b3d; --ink:#8fb0ff; --text:#e6ebf5; --muted:#9aa6bd;
  --margin:#ff7a80; --star:#ffc93c; --ok:#4fd18a; --bad:#ff7070; --card:#1b2333; --line:#2e3a52; --me:#3a3420;
  --common:#9aa8c4; --rare:#b394ff; --legend:#ffc93c; --hard:#8f7ad9; --xp:#5fd0f0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--text);font-family:var(--body);font-size:17px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;min-height:100vh}
.wrap{max-width:920px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative}
.wrap::before{content:"";position:absolute;top:0;bottom:0;left:max(8px,env(safe-area-inset-left,0px));width:2px;background:var(--margin);opacity:.7}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-left:12px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,7vw,52px);color:var(--ink);margin:0;line-height:1;text-wrap:balance;cursor:pointer}
.sub{color:var(--muted);margin:6px 0 0}
.me{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--display);font-size:22px;color:var(--ink);background:var(--card);border:2px solid var(--line);
  border-radius:999px;padding:4px 14px;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.chip b{color:var(--star)} .chip i{font-style:normal;color:var(--xp)}
.link{all:unset;cursor:pointer;font-weight:700;color:var(--ink);padding:6px 10px;border-radius:8px}
.link:hover,.link:focus-visible{background:var(--grid)}
.section{font-family:var(--display);font-size:28px;color:var(--margin);margin:28px 0 0 12px;font-weight:400;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.section small{font-family:var(--body);font-size:14px;color:var(--muted)}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:12px;padding-left:12px}
.tile{all:unset;cursor:pointer;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;
  display:flex;gap:14px;align-items:center;transition:transform .15s,border-color .15s;min-width:0;position:relative}
.tile:hover,.tile:focus-visible{transform:rotate(-1deg) translateY(-2px);border-color:var(--ink)}
.tile:focus-visible{outline:3px solid var(--star);outline-offset:2px}
.tile.hard{border-style:dashed;border-color:var(--hard)}
.tile .ic{font-family:var(--display);font-size:22px;width:56px;height:56px;flex:none;border-radius:12px;display:grid;place-items:center;color:#fff;line-height:1;text-align:center}
.tile h3{margin:0;font-family:var(--display);font-weight:400;font-size:24px;color:var(--ink)}
.tile p{margin:2px 0 0;color:var(--muted);font-size:15px}
.tile small{display:block;margin-top:4px;color:var(--star);font-weight:900;font-size:14px}
.x2{position:absolute;top:-10px;right:10px;background:var(--hard);color:#fff;font-weight:900;font-size:12px;padding:2px 8px;border-radius:999px}
.home{margin:20px 0 0 12px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.home .pet{width:110px;flex:none;cursor:pointer}
.home .txt{flex:1 1 240px;min-width:0}
.bubble{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:8px 12px;display:inline-block;font-weight:700;color:var(--ink)}
.lvl{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.lvl b{font-family:var(--display);font-weight:400;font-size:24px;color:var(--xp)}
.lvl em{font-style:normal;color:var(--muted);font-weight:700;font-size:14px}
.bars{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.bar{flex:1 1 140px;min-width:0}
.bar span{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.track{height:12px;border-radius:999px;background:var(--grid);overflow:hidden;margin-top:4px}
.fill{height:100%;border-radius:999px;transition:width .4s}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.sheet{margin-top:24px;margin-left:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:20px;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sheet h2{font-family:var(--display);font-weight:400;font-size:32px;color:var(--ink);margin:0}
.sheet h4{font-family:var(--display);font-weight:400;font-size:26px;color:var(--ink);margin:22px 0 4px}
.tag{font-weight:700;color:var(--muted);font-size:15px}
.progress{display:flex;gap:6px;flex-wrap:wrap}
.progress i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.progress i.ok{background:var(--ok);border-color:var(--ok)} .progress i.bad{background:var(--bad);border-color:var(--bad)}
.timer{font-family:var(--display);font-size:30px;color:var(--margin);font-variant-numeric:tabular-nums}
.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;max-width:620px;margin:22px auto 6px}
.classes button{all:unset;cursor:pointer;text-align:center;padding:18px 8px;border-radius:16px;border:2px solid var(--line);background:var(--paper)}
.classes button b{display:block;font-family:var(--display);font-weight:400;font-size:46px;color:var(--ink);line-height:1}
.classes button span{font-weight:700;color:var(--muted)}
.classes button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--grid)}
.classes button:hover{border-color:var(--ink)}
.classes button:focus-visible{outline:3px solid var(--star)}
.q{font-family:var(--display);font-size:clamp(44px,11vw,76px);text-align:center;color:var(--text);margin:24px 0 8px;letter-spacing:.04em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.q.multi{font-size:clamp(28px,7vw,42px);line-height:1.5;letter-spacing:.02em}
.q.text{font-family:var(--body);font-size:clamp(19px,4.6vw,23px);line-height:1.5;letter-spacing:0;text-align:left;max-width:600px;margin:22px auto 8px}
.q.center{text-align:center}
.q.shapes{letter-spacing:.12em;font-size:clamp(32px,8vw,54px)}
.q.grid{font-size:inherit;letter-spacing:0}
.q.stroop{font-family:var(--body);font-weight:900;text-transform:uppercase;font-size:clamp(40px,10vw,64px);letter-spacing:.03em}
.magic{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center}
.magic div,.pyr div{height:64px;display:grid;place-items:center;border:2px solid var(--line);border-radius:10px;background:var(--paper);font-family:var(--display);font-size:30px;color:var(--text)}
.magic .ask,.pyr .ask,.colmath .ask{border-color:var(--margin);color:var(--margin);background:transparent}
.magic .hid{color:var(--muted)}
.pyr{display:flex;flex-direction:column;align-items:center;gap:6px}
.pyr p{display:flex;gap:6px;margin:0}
.pyr div{width:58px;height:52px;font-size:26px}
.colwrap{overflow-x:auto}
.colmath{border-collapse:separate;border-spacing:2px;margin:0 auto;font-family:var(--display);font-size:clamp(28px,7vw,40px);color:var(--text)}
.colmath td{width:1.15em;height:1.4em;text-align:center;padding:0;border:none}
.colmath td.ask{border:2px solid var(--margin);border-radius:8px}
.colmath td.op{color:var(--muted)}
.colmath tr.line td.d{border-top:3px solid var(--text)}
.colmath td.vl{border-left:3px solid var(--text)}
.colmath td.ul{border-bottom:3px solid var(--text)}
.scatter{position:relative;max-width:440px;margin:0 auto;aspect-ratio:8/5;background:var(--paper);border:2px solid var(--line);border-radius:14px}
.scatter span{position:absolute;font-size:clamp(20px,5vw,30px);transform:translate(-50%,-50%);line-height:1}
.seqshow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:clamp(34px,9vw,52px);margin:26px 0 8px}
.seqshow span{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:6px 10px;line-height:1}
.count{text-align:center;font-family:var(--display);font-size:28px;color:var(--margin)}
.daypart{text-align:center;font-weight:900;color:var(--ink);font-size:20px;margin:14px 0 0}
.hint{text-align:center;color:var(--muted);margin:10px 0 18px;min-height:1.5em}
.hint.why{color:var(--ink);font-weight:700}
.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:520px;margin:0 auto}
.answers.three{grid-template-columns:repeat(3,1fr)}
.answers.words{grid-template-columns:1fr}
@media (min-width:560px){.answers.words.short{grid-template-columns:repeat(2,1fr)}}
.answers button{all:unset;cursor:pointer;text-align:center;font-family:var(--display);font-size:34px;padding:14px 8px;border-radius:14px;
  background:var(--paper);border:2px solid var(--line);color:var(--ink);transition:transform .1s;overflow-wrap:anywhere;display:flex;align-items:center;justify-content:center;gap:10px}
.answers.words button{font-family:var(--body);font-weight:700;font-size:18px;padding:14px 12px;line-height:1.3}
.answers button:hover{transform:scale(1.02);border-color:var(--ink)}
.answers button:focus-visible{outline:3px solid var(--star)}
.answers button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.answers button.bad{background:var(--bad);border-color:var(--bad);color:#fff;animation:shake .3s}
.answers.tap{grid-template-columns:repeat(var(--cols),1fr);gap:6px;max-width:420px}
.answers.tap button{font-family:inherit;font-size:clamp(20px,6vw,34px);padding:6px 0;aspect-ratio:1;border-radius:10px}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
.swatches{display:flex;gap:10px;align-items:center;justify-content:center;font-family:var(--display);font-size:40px}
.swatches .sw{width:64px;height:64px;border-width:3px}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.mem{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:8px;max-width:520px;margin:20px auto 0}
.mem button{all:unset;cursor:pointer;aspect-ratio:1;max-width:100%;border-radius:12px;font-size:clamp(22px,6vw,40px);display:grid;place-items:center;
  background:var(--ink);color:transparent;transition:background .25s}
.mem button.open,.mem button.done{background:var(--paper);outline:2px solid var(--line);color:inherit}
.mem button.done{opacity:.55}
.mem button:focus-visible{outline:3px solid var(--star)}
.schulte{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px;max-width:440px;margin:18px auto 0}
.schulte button{all:unset;cursor:pointer;aspect-ratio:1;display:grid;place-items:center;border-radius:10px;border:2px solid var(--line);background:var(--paper);font-family:var(--display);font-size:clamp(22px,6vw,34px);color:var(--ink)}
.schulte button.done{background:var(--grid);color:var(--muted);border-color:transparent}
.schulte button.bad{border-color:var(--bad);animation:shake .3s}
.schulte button:focus-visible{outline:3px solid var(--star)}
.clock{display:block;margin:10px auto 14px;width:min(220px,60vw);height:auto}
.prompt{font-family:var(--display);font-size:clamp(26px,6vw,36px);color:var(--ink);text-align:center;line-height:1.3;max-width:620px;margin:22px auto 10px;text-wrap:balance}
.draw{max-width:520px;margin:12px auto 0}
.draw canvas{width:100%;height:auto;display:block;background:#fff;border:2px solid var(--line);border-radius:14px;touch-action:none;cursor:crosshair}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.tools button{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;border:3px solid var(--line)}
.tools button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--grid)}
.tools button.size{border-radius:10px;width:auto;padding:0 10px;font-weight:900;display:grid;place-items:center;color:var(--ink)}
.tools button:focus-visible{outline:3px solid var(--star)}
.result{text-align:center;padding:16px 0}
.result .big{font-family:var(--display);font-size:56px;color:var(--ink);margin:0}
.result .st{font-size:44px;color:var(--star);letter-spacing:6px}
.btn{all:unset;cursor:pointer;background:var(--ink);color:var(--card);font-weight:900;padding:12px 20px;border-radius:12px;text-align:center}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--ink);padding:10px 18px}
.btn.small{padding:8px 14px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--star)}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.login{max-width:440px;margin:32px auto 0;text-align:center}
.login h2{font-family:var(--display);font-weight:400;font-size:40px;color:var(--ink);margin:0 0 6px}
.login form{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
input.field{font:inherit;font-size:20px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--text);flex:1 1 200px;min-width:0}
input.field:focus{outline:3px solid var(--star);border-color:var(--ink)}
.err{color:var(--bad);font-weight:700;min-height:1.5em;margin:10px 0 0}
.known{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.known button{all:unset;cursor:pointer;padding:6px 14px;border-radius:999px;border:2px solid var(--line);font-weight:700;color:var(--ink)}
.known button:hover,.known button:focus-visible{border-color:var(--ink)}
.note{color:var(--muted);font-size:14px;margin-top:18px}
/* котёнок и комната */
.catpage{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:24px;margin-top:16px}
@media (max-width:680px){.catpage{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--paper);border-radius:16px;padding:12px;text-align:center;border:2px solid var(--line)}
.bigcat{width:100%;max-width:240px;cursor:pointer;display:block;margin:0 auto}
.bigcat.purr{animation:purr .5s}
@keyframes purr{30%{transform:scale(1.04) rotate(-2deg)}60%{transform:scale(.98) rotate(2deg)}}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:6px 12px;border-radius:999px;border:2px solid var(--line);font-weight:700;font-size:15px}
.tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.tabs button:focus-visible{outline:3px solid var(--star)}
.tabs.big button{font-size:16px;padding:8px 14px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:12px}
.item{all:unset;cursor:pointer;border:2px solid var(--line);border-radius:12px;padding:6px;text-align:center;background:var(--paper);min-width:0;display:flex;flex-direction:column;gap:2px}
.item svg{width:100%;height:auto;display:block}
.item span{display:block;font-size:13px;font-weight:700;line-height:1.2}
.item.on{border-color:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 35%,transparent)}
.item.locked{cursor:default;opacity:.55}
.item.locked svg{filter:grayscale(1) brightness(.45)}
.item:focus-visible{outline:3px solid var(--star)}
.item .price{color:var(--star);font-weight:900}
.r-common{border-color:var(--common)} .r-rare{border-color:var(--rare)} .r-legend{border-color:var(--legend)}
.rt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:900}
.rt.r-common{color:var(--common)} .rt.r-rare{color:var(--rare)} .rt.r-legend{color:var(--legend)}
.roomview{border-radius:16px;overflow:hidden;border:2px solid var(--line);background:var(--paper)}
.roomview svg{display:block;width:100%;height:auto}
.chests{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:8px}
.chest{border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center;background:var(--paper);display:flex;flex-direction:column;gap:6px;align-items:center}
.chest svg{width:96px;height:auto}
.chest h5{margin:0;font-family:var(--display);font-weight:400;font-size:22px;color:var(--ink)}
.chest p{margin:0;font-size:13px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(10,14,30,.6);display:grid;place-items:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--card);border-radius:20px;padding:22px;max-width:380px;width:100%;text-align:center;border:3px solid var(--line)}
.modal h3{font-family:var(--display);font-weight:400;font-size:32px;margin:6px 0;color:var(--ink)}
.modal .prize{width:180px;margin:0 auto;display:block}
.modal .prize svg{width:100%;height:auto}
.modal .chestbig{width:150px;margin:10px auto;display:block;animation:wobble .25s infinite}
@keyframes wobble{50%{transform:rotate(6deg) scale(1.05)}0%,100%{transform:rotate(-6deg)}}
.modal .glow{animation:pop .5s}
@keyframes pop{0%{transform:scale(.3);opacity:0}80%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--card);
  font-weight:900;padding:12px 20px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:pop .4s;max-width:calc(100% - 32px);text-align:center}
.board{overflow-x:auto;margin-top:16px}
table.lb{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.lb th,.lb td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
.lb th{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.lb td.n,.lb th.n{text-align:right}
.lb td.place{font-family:var(--display);font-size:24px;color:var(--ink);width:2.5em}
.lb td.av svg{width:44px;height:auto;display:block}
.lb tr.self td{background:var(--me)}
.medal1{color:var(--star)} .medal2{color:#8f9bb0} .medal3{color:#c2793a}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.foot{color:var(--muted);font-size:14px;padding-left:12px;margin-top:28px}
.evm{max-width:420px}.evm canvas{width:100%;height:auto;display:block;border-radius:14px;touch-action:none;margin:8px 0;cursor:pointer}
.evm .answers button{font-size:26px;padding:10px 6px}.evm .answers.words button{font-size:16px}
.poops{display:flex;gap:6px;justify-content:center;margin:4px 0 8px}.poops button{all:unset;cursor:pointer;font-size:30px;line-height:1;padding:4px;border-radius:10px}.poops button:hover,.poops button:focus-visible{background:var(--grid)}
.modal.wide{max-width:640px;max-height:calc(100vh - 40px);overflow-y:auto}.items.ten{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}.items.ten .item{cursor:default}
.evicon{font-size:64px;line-height:1;margin-top:4px}
@media (max-width:420px){.answers button{font-size:28px}.magic{grid-template-columns:repeat(3,56px)}.magic div{height:56px}.pyr div{width:50px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function eyesSVG(mood,eye,F,fid){const L=F.light?'#f2f2ff':'#2b2230';
  if(mood==='sleep')return `<path d="M70 96 Q80 104 90 96 M110 96 Q120 104 130 96" fill="none" stroke="${L}" stroke-width="4" stroke-linecap="round"/>`;
  if(eye.kind==='star'){const s=star5(80,96,11,'#ffd166','#c99700')+star5(120,96,11,'#ffd166','#c99700');return `<g filter="url(#${fid})" opacity=".8">${s}</g>${s}`}
  if(eye.kind==='heart')return heart(80,99,9,'#ff4d6d')+heart(120,99,9,'#ff4d6d');
  if(eye.kind==='glow'){const c=eye.color;
    if(mood==='happy'){const p=`<path d="M70 98 Q80 86 90 98 M110 98 Q120 86 130 98" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round"/>`;return `<g filter="url(#${fid})">${p}</g>${p}`}
    const ry=mood==='sad'?7:10;const brow=mood==='sad'?`<path d="M68 84 L90 90 M132 84 L110 90" stroke="${L}" stroke-width="3.5" stroke-linecap="round"/>`:'';
    return `<ellipse cx="80" cy="97" rx="10" ry="${ry+2}" fill="#0b0b12"/><ellipse cx="120" cy="97" rx="10" ry="${ry+2}" fill="#0b0b12"/>
    <g filter="url(#${fid})"><ellipse cx="80" cy="97" rx="8" ry="${ry}" fill="${c}"/><ellipse cx="120" cy="97" rx="8" ry="${ry}" fill="${c}"/></g>
    <ellipse cx="80" cy="97" rx="6" ry="${ry-2}" fill="${c}"/><ellipse cx="120" cy="97" rx="6" ry="${ry-2}" fill="${c}"/>
    <ellipse cx="80" cy="97" rx="1.8" ry="${ry-3}" fill="#0b0b12" opacity=".7"/><ellipse cx="120" cy="97" rx="1.8" ry="${ry-3}" fill="#0b0b12" opacity=".7"/>${brow}`}
  if(mood==='happy')return `<path d="M70 98 Q80 86 90 98 M110 98 Q120 86 130 98" fill="none" stroke="${L}" stroke-width="4.5" stroke-linecap="round"/>`;
  if(mood==='sad')return `<ellipse cx="80" cy="98" rx="7" ry="8" fill="#fff" stroke="${F.line}" stroke-width="2"/><ellipse cx="120" cy="98" rx="7" ry="8" fill="#fff" stroke="${F.line}" stroke-width="2"/><circle cx="80" cy="100" r="4.5" fill="#2b2230"/><circle cx="120" cy="100" r="4.5" fill="#2b2230"/><path d="M68 84 L90 90 M132 84 L110 90" stroke="${L}" stroke-width="3.5" stroke-linecap="round"/>`;
  return `<ellipse cx="80" cy="96" rx="9" ry="11" fill="#fff" stroke="${F.line}" stroke-width="2"/><ellipse cx="120" cy="96" rx="9" ry="11" fill="#fff" stroke="${F.line}" stroke-width="2"/><ellipse cx="81" cy="98" rx="5.5" ry="7.5" fill="#2b2230"/><ellipse cx="121" cy="98" rx="5.5" ry="7.5" fill="#2b2230"/><circle cx="83" cy="94" r="2.4" fill="#fff"/><circle cx="123" cy="94" r="2.4" fill="#fff"/>`}

    headPat=`<path d="M48 70 Q100 40 152 70" fill="none" stroke="#ff924c" stroke-width="6" opacity=".7"/><path d="M48 80 Q100 50 152 80" fill="none" stroke="#8ac926" stroke-width="6" opacity=".7"/><path d="M48 90 Q100 60 152 90" fill="none" stroke="#1982c4" stroke-width="6" opacity=".7"/>`}
  else if(pat==='shine'){headPat=`<ellipse cx="74" cy="70" rx="16" ry="9" fill="#fff" opacity=".45" transform="rotate(-25 74 70)"/>`;bodyPat=`<ellipse cx="72" cy="158" rx="10" ry="16" fill="#fff" opacity=".35"/>`}
  else if(pat==='flame'){headPat=`<path d="M100 54 Q88 70 96 82 Q98 72 104 70 Q112 82 106 90 Q120 80 112 64 Q108 72 104 66 Z" fill="#ffd166"/>`;bodyPat=`<path d="M70 210 Q66 184 80 172 Q80 190 90 194 Q92 176 100 164 Q108 180 112 194 Q120 186 122 172 Q136 186 130 210 Z" fill="#ffd166" opacity=".9"/>`}
  else if(pat==='circuit'){const n=F.neon;const g=`filter="url(#${ids.f})"`;
    headPat=`<g ${g}><path d="M52 84 L66 84 L72 76 M148 114 L132 114 L126 122 M88 60 L88 70 L100 70" fill="none" stroke="${n}" stroke-width="3"/></g><path d="M52 84 L66 84 L72 76 M148 114 L132 114 L126 122 M88 60 L88 70 L100 70" fill="none" stroke="${n}" stroke-width="2"/><circle cx="72" cy="76" r="3" fill="${n}"/><circle cx="126" cy="122" r="3" fill="${n}"/>`;
    bodyPat=`<path d="M60 160 L78 160 L84 170 L100 170 M140 184 L122 184 L116 194" fill="none" stroke="${n}" stroke-width="2.5"/><circle cx="100" cy="170" r="3" fill="${n}"/><circle cx="116" cy="194" r="3" fill="${n}"/>`}

  const under=`<g${ghost}><path d="M134 196 C178 198 186 160 168 128" fill="none" stroke="${F.line}" stroke-width="17" stroke-linecap="round"/>

const PIX=["","","","","...oo..........oo...","...opo........opo...","...oppooooooooppo...","..ommmmmmmmmmmmmmo..","..ommmmmmmmmmmmmmo..",
"..ommmmeemmeemmmmo..","..ommmmeemmeemmmmo..","..ommmmmmnnmmmmmmo..","..ommmmmommommmmmo..","..ommmmmmoommmmmmo..","...ommmmmmmmmmmmo...",
"....oooooooooooo....","....ommmmmmmmmmo....","...ommmbbbbbbmmmo...","...ommmbbbbbbmmmo...","...ommmbbbbbbmmmo...","...ommmmmmmmmmmmo...","...ommmo....ommmo...","...ooooo....ooooo..."];
const PIX_TAIL=[[13,18],[14,18],[15,18],[16,18],[17,18],[18,17],[19,17]];
function pixelCat(S,F,mood,eye,ids){
  const glowCol=mood==='sleep'?null:eye.kind==='glow'?eye.color:eye.kind==='star'?'#ffd166':eye.kind==='heart'?'#ff4d6d':null;
  const col={o:F.line,m:F.main,d:F.dark,b:F.belly,n:'#f48fb1',p:'#ffb3c7',e:glowCol||'#2b2230'};
  const cell=(r,c,fill)=>`<rect x="${c*10}" y="${r*10-10}" width="10.4" height="10.4" fill="${fill}"/>`;
  let body='',head='',eyes='';
  PIX.forEach((row,r)=>{for(let c=0;c<row.length;c++){const ch=row[c];if(ch==='.')continue;
    let k=ch;if(k==='e'){if(mood==='happy'&&r===9)k='m';else if(mood!=='normal'&&r===9)k='m';else{eyes+=cell(r,c,col.e);continue}}
    const s=cell(r,c,col[k]);if(r>=16)body+=s;else head+=s}});
  if(mood==='happy'){head+=cell(11,4,'#ff8fab')+cell(11,15,'#ff8fab')}
  if(mood==='sad'){head+=cell(8,7,F.light?'#f2f2ff':F.line)+cell(8,12,F.light?'#f2f2ff':F.line)}
  if(!glowCol&&mood==='normal')eyes+=`<rect x="72" y="82" width="4" height="4" fill="#fff"/><rect x="112" y="82" width="4" height="4" fill="#fff"/>`;
  if(glowCol)eyes=`<g filter="url(#${ids.f})">${eyes}</g>`+eyes;
  const tail=PIX_TAIL.map(([r,c])=>cell(r,c,F.dark)).join('');
  return {under:tail+body,shape:`<rect x="40" y="150" width="120" height="50"/>`,over:'',head:head+eyes}}

function brickCat(S,F,mood,eye,ids){const multi=S.pat==='multi';
  const C=multi?{tail:'#f77f00',body:'#2f6fdc',legs:'#2e9e5b',ears:'#f5c518',head:'#d63b3b'}:{tail:F.main,body:F.main,legs:F.main,ears:F.main,head:F.main};
  const L=F.line;const stud=(x,y,c)=>`<rect x="${x}" y="${y}" width="16" height="9" rx="3" fill="${c}" stroke="${L}" stroke-width="2"/><rect x="${x+3}" y="${y+2}" width="4" height="4" rx="1" fill="#fff" opacity=".35"/>`;
  const under=`<rect x="136" y="126" width="18" height="62" rx="4" fill="${C.tail}" stroke="${L}" stroke-width="3" transform="rotate(25 145 157)"/>
  <rect x="58" y="140" width="84" height="64" rx="6" fill="${C.body}" stroke="${L}" stroke-width="3"/>
  <rect x="78" y="156" width="44" height="36" rx="6" fill="${F.belly}" opacity=".9"/><rect x="64" y="146" width="7" height="50" rx="3" fill="#fff" opacity=".25"/>`;
  const over=`<rect x="60" y="196" width="36" height="20" rx="4" fill="${C.legs}" stroke="${L}" stroke-width="3"/><rect x="104" y="196" width="36" height="20" rx="4" fill="${C.legs}" stroke="${L}" stroke-width="3"/>`;
  const head=`${stud(57,22,C.ears)}${stud(127,22,C.ears)}
  <rect x="50" y="30" width="30" height="30" rx="4" fill="${C.ears}" stroke="${L}" stroke-width="3"/><rect x="120" y="30" width="30" height="30" rx="4" fill="${C.ears}" stroke="${L}" stroke-width="3"/>
  <rect x="58" y="40" width="14" height="14" rx="2" fill="#ffb3c7"/><rect x="128" y="40" width="14" height="14" rx="2" fill="#ffb3c7"/>
  ${stud(62,45,C.head)}${stud(92,45,C.head)}${stud(122,45,C.head)}
  <rect x="44" y="52" width="112" height="92" rx="10" fill="${C.head}" stroke="${L}" stroke-width="3"/>
  <rect x="52" y="60" width="9" height="60" rx="4" fill="#fff" opacity=".25"/><rect x="80" y="104" width="40" height="24" rx="8" fill="${F.belly}" opacity=".9"/>
  ${mood==='happy'?`<rect x="56" y="108" width="14" height="10" rx="5" fill="#ff8fab" opacity=".6"/><rect x="130" y="108" width="14" height="10" rx="5" fill="#ff8fab" opacity=".6"/>`:''}
  ${eyesSVG(mood,eye,{...F,line:'#1a1a1a',light:false},ids.f)}${noseSVG('#1a1a1a')}${mouthSVG(mood,'#1a1a1a')}`;
  return {under,shape:`<rect x="58" y="140" width="84" height="64" rx="6"/>`,over,head}}

function catSVG(cat,mood){const S=SKIN_BY_ID[cat&&cat.skin]||SKINS[0];const F=S.c;
  const wear=(cat&&cat.wear)||{};const it=s=>{const w=WEAR_BY_ID[wear[s]];return w&&w.slot===s?w:null};
  const ids={b:uid('b'),h:uid('h'),f:uid('f')};
  const ei=it('eyes');const eye=ei?ei.eye:S.glow?{kind:'glow',color:S.glow}:{kind:'normal'};
  const parts=(S.st==='pixel'?pixelCat:S.st==='brick'?brickCat:softCat)(S,F,mood,eye,ids);
  const body=it('body'),fx=w=>w?(w.glowy?w.svg.replace(/FID/g,ids.f):w.svg):'';
  return `<svg viewBox="0 -20 200 248" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Котёнок">
  <defs><clipPath id="${ids.b}">${parts.shape}</clipPath><clipPath id="${ids.h}"><ellipse cx="100" cy="98" rx="55" ry="46"/></clipPath>
  <filter id="${ids.f}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2"/></filter></defs>
  ${fx(it('back'))}${parts.under}
  ${body&&body.clip?`<g clip-path="url(#${ids.b})">${body.clip}</g>`:''}${body&&body.svg?body.svg:''}
  ${parts.over}${parts.head}${fx(it('neck'))}${mood==='sleep'?'':fx(it('glasses'))}${fx(it('hat'))}${fx(it('toy'))}${mood==='sleep'?'<text x="146" y="30" font-family="Nunito,sans-serif" font-size="22" font-weight="900" fill="#7a8bb5">z</text><text x="164" y="12" font-family="Nunito,sans-serif" font-size="30" font-weight="900" fill="#7a8bb5">Z</text>':''}</svg>`}

function wearPreview(w){return catSVG({skin:'sk_orange',wear:{[w.slot]:w.id}},'normal')}
function skinPreview(s,mood='normal'){return catSVG({skin:s.id,wear:{}},mood)}

function numOpts(ans){const s=new Set([ans]);let t=0;
  while(s.size<4&&t++<60){const d=rnd(1,Math.max(3,Math.round(Math.abs(ans)*.15)))*(Math.random()<.5?-1:1);if(ans+d>=0)s.add(ans+d)}
  let k=1;while(s.size<4)s.add(ans+k++);return shuffle([...s].map(String))}

function mathTask(){
  const op=pick(level<=2?['+','−']:['+','−','×','÷']);let a,b,ans;const max=MAX();
  if(op==='+'){a=rnd(1,max-1);b=rnd(1,max-a);ans=a+b}
  else if(op==='−'){a=rnd(2,max);b=rnd(1,a-1);ans=a-b}
  else if(op==='×'){a=rnd(2,level===3?9:12);b=rnd(2,9);ans=a*b}
  else{b=rnd(2,9);ans=rnd(2,level===3?9:12);a=b*ans}
  return {q:`${a} ${op} ${b} = ?`,hint:'Посчитай в уме',ans:String(ans),opts:numOpts(ans)}}
function blitzTask(){const t=mathTask();t.hint='Быстрее!';return t}
function boxTask(){const max=MAX();const kind=level>=3?rnd(0,3):rnd(0,1);let q,ans;
  if(kind===0){const a=rnd(1,max-1),b=rnd(1,max-a);ans=b;q=`${a} + ☐ = ${a+b}`}
  else if(kind===1){const a=rnd(2,max),b=rnd(1,a-1);ans=b;q=`${a} − ☐ = ${a-b}`}
  else if(kind===2){const a=rnd(2,9),b=rnd(2,9);ans=b;q=`${a} × ☐ = ${a*b}`}
  else{const b=rnd(2,9),c=rnd(2,9);ans=b*c;q=`☐ ÷ ${b} = ${c}`}
  return {q,hint:'Какое число спряталось в окошке?',ans:String(ans),opts:numOpts(ans)}}
function cmpTask(){const max=MAX();let L,R,lv,rv;
  const expr=()=>{if(level>=3&&Math.random()<.4){const a=rnd(2,9),b=rnd(2,9);return [`${a} × ${b}`,a*b]}
    if(Math.random()<.5){const a=rnd(1,Math.floor(max/2)),b=rnd(1,Math.floor(max/2));return [`${a} + ${b}`,a+b]}
    const a=rnd(2,max),b=rnd(1,a-1);return [`${a} − ${b}`,a-b]};
  if(level===1){lv=rnd(0,20);rv=Math.random()<.25?lv:rnd(0,20);L=lv;R=rv}
  else{[L,lv]=expr();
    if(level===2){rv=Math.random()<.3?lv:Math.max(0,lv+rnd(-3,3));R=rv}
    else{[R,rv]=expr();if(Math.random()<.3){const a=rnd(2,9);if(lv%a===0&&lv/a>1){R=`${a} × ${lv/a}`;rv=lv}else{R=lv;rv=lv}}}}
  return {q:`${L} ☐ ${R}`,cls:'multi',hint:'Поставь знак: больше, меньше или равно',ans:lv>rv?'>':lv<rv?'<':'=',opts:['>','<','=']}}

const STATS=[['food','Сытость','var(--ok)'],['joy','Настроение','var(--star)'],['fun','Развлечение','#e76f51'],['sport','Спорт','#3a86ff'],['energy','Энергия','#9b5de5']];
const STAT_NAME=Object.fromEntries(STATS.map(s=>[s[0],s[1]]));
const sleeping=()=>player&&player.cat.sleepUntil>Date.now();
function tick(){if(!player)return;const c=player.cat,now=Date.now();if(now<=c.t){c.t=now;return}
  const from=c.t,sleepEnd=Math.max(from,Math.min(now,c.sleepUntil));const hs=(sleepEnd-from)/36e5,ha=(now-sleepEnd)/36e5;
  if(hs>0){c.energy=clamp(c.energy+100/SLEEP_H*hs,0,100);c.food=clamp(c.food-3*hs,0,100);c.joy=clamp(c.joy-1*hs,0,100);c.fun=clamp(c.fun-1*hs,0,100);c.sport=clamp(c.sport-1*hs,0,100)}
  if(ha>0){c.food=clamp(c.food-6*ha,0,100);c.joy=clamp(c.joy-(4+2*c.poops)*ha,0,100);c.fun=clamp(c.fun-5*ha,0,100);c.sport=clamp(c.sport-4*ha,0,100);c.energy=clamp(c.energy-5*ha,0,100)}
  while(c.poopNext<=now){c.poops=Math.min(5,c.poops+1);c.poopNext+=rnd(8,15)*36e5}
  while(c.feeder.next<=now){c.feeder.n=Math.min(FEEDER_MAX,c.feeder.n+1);c.feeder.next+=FEEDER_EVERY}
  while(c.food<40&&c.feeder.n>0){c.food=clamp(c.food+30,0,100);c.feeder.n--}
  if(c.energy<=0&&c.sleepUntil<now)c.sleepUntil=now+SLEEP_H*36e5;
  c.t=now}
function mood(){if(!player)return 'normal';const c=player.cat;if(sleeping())return 'sleep';const low=Math.min(c.food,c.joy,c.fun,c.sport,c.energy);
  return low<20||c.poops>=3?'sad':(c.food+c.joy+c.fun+c.sport+c.energy)/5>=62?'happy':'normal'}
const emptyStat=()=>{const c=player.cat;const s=STATS.find(([k])=>c[k]<=0);return s?s[1]:null};
function canPlayWithCat(){tick();if(sleeping())return 'Котёнок спит. Поиграть можно, когда он проснётся.';const e=emptyStat();if(e)return `Шкала «${e}» пустая. Сначала позаботься о котёнке.`;
  if(player.cat.energy<10)return 'Котёнок слишком устал. Отправь его спать.';return null}
function applyEffects(eff){const c=player.cat;for(const [k,v] of Object.entries(eff))if(k in c)c[k]=clamp(c[k]+v,0,100)}

const TITLES=[[1,'Котёнок-новичок'],[3,'Юный умник'],[6,'Знаток'],[10,'Мудрый кот'],[15,'Профессор'],[20,'Гений'],[30,'Легенда тетрадки']];
function lvlInfo(xp){let l=1,need=100,x=xp;while(x>=need){x-=need;l++;need=100+(l-1)*40}return {l,cur:x,need,title:TITLES.filter(t=>t[0]<=l).pop()[1]}}

  if(store.mode==='local'){if(localPlayers()[key])return 'Такой ник уже есть. Придумай другой или нажми на свой ник ниже.';

/* Награда за игру: звёзды, опыт, уровень */
function grant(stars,xp){const before=lvlInfo(player.xp).l;player.stars+=stars;player.xp+=xp;
  const after=lvlInfo(player.xp).l;const bonus=after>before?5*(after-before):0;player.stars+=bonus;return {xp,up:after>before,level:after,bonus}}
function record(game,stars,xp,value,lowerBetter,bestKey=game){
  const b=player.buff||{};if(b.xp2>0){xp*=2;player.buff={...b,xp2:b.xp2-1}}
  player.games+=1;const {up,level:after,bonus}=grant(stars,xp);
  tick();player.cat.joy=clamp(player.cat.joy+15,0,100);player.cat.food=clamp(player.cat.food-3,0,100);
  if(value!=null){const old=player.best[bestKey];if(old==null||(lowerBetter?value<old:value>old))player.best={...player.best,[bestKey]:value}}
  savePlayer(true);renderMe();return {xp,up,level:after,bonus,doubled:b.xp2>0}}

  <button class="link" id="toCat">Котёнок</button><button class="link" id="toLeaders">Лидеры</button>${store.mode==='local'?'<button class="link" id="logout">Сменить игрока</button>':''}`;

function chestSVG(tier,set){const c={small:['#a0692f','#5c3a17','#c99700'],rare:['#7a4fd6','#3b2a6b','#e9e4ff'],royal:['#f4b400','#a06c00','#e63946'],gift:['#e63946','#8a1c25','#ffd166']}[tier];

  <path d="M12 46 Q12 14 60 14 Q108 14 108 46 Z" fill="${c[0]}" stroke="${c[1]}" stroke-width="4"/>
  <rect x="12" y="42" width="96" height="10" fill="${c[1]}"/><rect x="52" y="38" width="16" height="16" rx="3" fill="${c[2]}" stroke="${c[1]}" stroke-width="3"/>
  <path d="M30 18 L30 94 M90 18 L90 94" stroke="${c[1]}" stroke-width="4" opacity=".6"/>${emblem}</svg>`}
function rollItem(S,w){const owned=new Set(S.get());const total=w.common+w.rare+w.legend;const r=Math.random()*total;
  const rar=r<w.common?'common':r<w.common+w.rare?'rare':'legend';
  let pool=S.pool.filter(x=>x.r===rar&&!owned.has(x.id));
  if(!pool.length){const order=rar==='legend'?['legend','rare','common']:rar==='rare'?['rare','legend','common']:['common','rare','legend'];
    for(const o of order){pool=S.pool.filter(x=>x.r===o&&!owned.has(x.id));if(pool.length)break}}
  if(!pool.length){const same=S.pool.filter(x=>x.r===rar);return {item:pick(same.length?same:S.pool),dupe:true}}
  return {item:pick(pool),dupe:false}}
function openChest(setKey,tier,count=1){const S=CHEST_SETS[setKey];const gift=tier==='gift';const T=gift?null:S.tiers[tier];if(gift)count=1;
  const cost=gift?0:count===10?Math.round(T.cost*9):T.cost;
  if(gift&&!player.gifts[setKey])return;if(!gift&&wallet()<cost)return;
  if(gift)player.gifts={...player.gifts,[setKey]:false};else player.spent+=cost;
  const got=[];let refund=0;
  for(let i=0;i<count;i++){const r=rollItem(S,gift?S.gift:T.w);if(r.dupe){r.refund=RARITY[r.item.r].dup;refund+=r.refund}else S.add(r.item.id);got.push(r)}
  player.spent=Math.max(-1e9,player.spent-refund);
  player.cat.joy=clamp(player.cat.joy+10,0,100);savePlayer(true);renderMe();
  const m=$('#modal');
  m.innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-label="Открываем сундук"><div class="modal"><h3>Открываем${count>1?` ${count} сундуков`:''}…</h3>${chestSVG(tier,setKey).replace('<svg','<svg class="chestbig"')}</div></div>`;
  tone(300,0,.1,'square',.05);tone(340,.25,.1,'square',.05);tone(380,.5,.1,'square',.05);
  setTimeout(()=>{fanfare();const md=m.querySelector('.modal');if(!md)return;
    if(count===1){const {item,dupe}=got[0];
      md.innerHTML=`<p class="rt r-${item.r}" style="margin:0">${RARITY[item.r].name}${setKey==='cats'?' порода':' вещь'}</p><h3>${esc(item.name)}</h3>
      <div class="prize glow">${S.preview(item)}</div><p>${dupe?`Такое уже есть. Возвращаем ★ ${got[0].refund}.`:setKey==='cats'?'Новый котёнок в коллекции!':'Новая вещь в коллекции!'}</p>
      <div class="btns">${dupe?'':`<button class="btn" id="useNow">${setKey==='cats'?'Играть им':setKey==='room'?'Поставить':'Надеть'}</button>`}<button class="btn alt" id="closeM">Отлично!</button></div>`;
      const u=$('#useNow');if(u)u.onclick=()=>{const tab=S.equip(item);savePlayer(true);m.innerHTML='';catScreen(tab)}}
    else{const fresh=got.filter(g=>!g.dupe).length;
      md.classList.add('wide');md.innerHTML=`<h3>10 сундуков открыто!</h3><p>Новых: <b>${fresh}</b>${refund?` · вернули ★ ${refund} за повторы`:''}</p>
      <div class="items ten">${got.map(({item,dupe})=>`<div class="item r-${item.r} glow">${S.preview(item)}<span>${esc(item.name)}</span><span class="rt ${dupe?'':'r-'+item.r}">${dupe?'повтор':'новое!'}</span></div>`).join('')}</div>
      <div class="btns"><button class="btn" id="closeM">Отлично!</button></div>`}
    $('#closeM').onclick=()=>{m.innerHTML='';catScreen('chest')};$('#closeM').focus()},reduced?100:1300)}

const lvlTag=g=>g.levels?` <span class="tag">· ${level} класс</span>`:'';
function quiz(key){screen='quiz';stopTimer();const g=GAMES[key];let i=0,score=0,res=[],started=false,timeLeft=g.timed||0;const stamp=Symbol();quiz.cur=stamp;
  const alive=()=>quiz.cur===stamp&&screen==='quiz';
  function head(){return `<div class="top">${backBtn()}<h2>${g.title}${lvlTag(g)}</h2>
    ${g.timed?`<span class="timer" id="tm">⏱ ${timeLeft} · ${score}</span>`:`<div class="progress">${Array.from({length:10},(_,k)=>`<i class="${res[k]||''}"></i>`).join('')}</div>`}</div>`}
  function step(){if(!alive())return;if(!g.timed&&i>=10)return finish();
    const t=g.gen();
    if(t.pre){app.innerHTML=`<section class="sheet">${head()}<p class="hint" style="margin-top:18px">Запомни!</p>${t.pre}<p class="count" id="cd"></p></section>`;$('#back').onclick=menu;
      let left=Math.ceil(t.preMs/1000);const cd=$('#cd');cd.textContent=left;const iv=setInterval(()=>{left--;if(!alive()){clearInterval(iv);return}cd.textContent=left>0?left:''},1000);
      setTimeout(()=>{clearInterval(iv);if(alive())show(t)},t.preMs);return}
    show(t)}
  function show(t){
    const longest=Math.max(...t.opts.map(o=>String(o).length));
    let cls=t.tap?'tap':(t.opts.length===3?'three ':'')+(longest>14?'words':longest>5?'words short':'');
    const optHTML=(o,k)=>`<button data-i="${k}">${t.optStyle?`<span style="display:inline-block;${t.optStyle[k]}">${esc(o)}</span>`:esc(o)}</button>`;
    app.innerHTML=`<section class="sheet">${head()}
    ${t.label?`<p class="daypart">${t.label}</p>`:''}
    ${t.svg?t.svg:t.q?`<div class="q ${t.cls||''}">${t.raw?t.q:esc(t.q)}</div>`:''}<p class="hint" id="hint">${t.hint}</p>
    <div class="answers ${cls}" ${t.tap?`style="--cols:${t.tap}"`:''}>${t.opts.map(optHTML).join('')}</div></section>`;
    $('#back').onclick=menu;
    let locked=false;const btns=[...app.querySelectorAll('.answers button')];
    btns.forEach(b=>b.onclick=()=>{if(locked)return;locked=true;
      if(!started){started=true;if(g.timed)startTimer()}
      const isAns=x=>t.ansIdx!=null?+x.dataset.i===t.ansIdx:t.opts[+x.dataset.i]===t.ans;const ok=isAns(b);beep(ok);b.classList.add(ok?'ok':'bad');
      if(!ok)btns.forEach(x=>{if(isAns(x))x.classList.add('ok')});
      if(t.why&&!g.timed){const h=$('#hint');h.textContent=t.why;h.classList.add('why')}
      res[i]=ok?'ok':'bad';if(ok)score++;i++;
      const tm=$('#tm');if(tm)tm.textContent=`⏱ ${timeLeft} · ${score}`;
      if(g.timed){setTimeout(()=>{if(alive()&&timeLeft>0)step()},ok?300:900);return}
      const h=$('#hint');if(!t.why){h.textContent=ok?pick(['Правильно!','Верно!','Молодец!','Точно!']):(t.ansLabel||`Правильный ответ: ${t.ans}`);h.classList.add('why')}
      const nx=document.createElement('div');nx.className='btns';nx.innerHTML=`<button class="btn" id="next">${i>=10?'Посмотреть результат':'Дальше →'}</button>`;
      app.querySelector('.sheet').appendChild(nx);const nb=$('#next');nb.onclick=()=>{if(alive())step()};nb.focus({preventScroll:true})});
    if(!t.tap&&btns[0])btns[0].focus({preventScroll:true})}
  function startTimer(){timerId=setInterval(()=>{timeLeft--;const tm=$('#tm');if(tm)tm.textContent=`⏱ ${timeLeft} · ${score}`;if(timeLeft<=0){stopTimer();finish()}},1000)}
  function finish(){if(!alive())return;screen='result';
    if(g.tourney){const today=dayKey();const first=player.tDate!==today;if(first){player.tDate=today;player.tClass=level;player.tScore=score}
      const st=Math.floor(score/5);const info=record(key,st,score*10+10,null);
      resultScreen(`${score} ${plural(score,['пример','примера','примеров'])}`,st,first?'Результат записан в турнир дня':'Сегодня ты уже участвовал, результат не засчитан',null,info,
        `<div class="btns"><button class="btn" id="toT">Таблица турнира</button></div>`);const tt=$('#toT');if(tt)tt.onclick=()=>tourneyScreen(level);return}
    const st=g.hard?Math.floor(score/2):Math.floor(score/3);
    const xp=score*(g.hard?20:10)+10;const info=record(key,st,xp,score,false);
    const msg=score===10?'Отлично!':score>=7?'Молодец!':score>=4?'Хорошо, тренируйся ещё':'Попробуй ещё раз';
    resultScreen(`${score} из 10`,st,msg,()=>quiz(key),info)}
  step()}

function schulte(){screen='schulte';stopTimer();const n=[3,4,5,5][level-1],N=n*n;const nums=shuffle(Array.from({length:N},(_,i)=>i+1));

  $('#back').onclick=menu;
  app.querySelectorAll('.schulte button').forEach(b=>b.onclick=()=>{const v=+b.dataset.v;if(b.classList.contains('done'))return;

    else{b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');tone(200,0,.15,'square',.05)}});
  function finish(){stopTimer();screen='result';const s=Math.round((Date.now()-t0)/1000);const [a,b]=[[10,18],[25,40],[45,70],[55,85]][level-1];
    const st=s<=a?3:s<=b?2:1;const info=record('schulte',st,20+N*2,s,true,'schulte'+level);const old=player.best['schulte'+level];

    if(tap){if(Math.hypot(tap[0]-dot.x,tap[1]-dot.y)<r+14){st.score++;jump=1;cx=dot.x;cy=Math.min(470,dot.y+60);tone(800,0,.08,'triangle');dot.x=rnd(40,320);dot.y=rnd(60,420);dot.tx=dot.x;dot.ty=dot.y}else missT=300}
    jump=Math.max(0,jump-dt/400);missT-=dt;
    ctx.fillStyle='#f3e6d3';ctx.fillRect(0,0,W,H);ctx.fillStyle='#c89566';ctx.fillRect(0,380,W,100);
    drawCatImg(ctx,cat,cx,cy-jump*40,80,Math.sin(el/120)*.08);
    ctx.fillStyle='rgba(255,0,0,.25)';ctx.beginPath();ctx.arc(dot.x,dot.y,r+8,0,7);ctx.fill();ctx.fillStyle='#ff1f3d';ctx.beginPath();ctx.arc(dot.x,dot.y,r*.55,0,7);ctx.fill();
    if(missT>0){ctx.fillStyle='#d62839';ctx.font='bold 22px Nunito, sans-serif';ctx.textAlign='center';ctx.fillText('Мимо!',180,40)}
    return el>=DUR}}},
 jump(ctx,cat,W,H,st){let y=0,vy=0,obs=[],spawn=800,lives=3,hurt=0;const G=420,DUR=40000;
  return {label:()=>`${'❤️'.repeat(lives)} · ${st.score}`,stars:s=>Math.floor(s/4),result:s=>`${s} ${plural(s,['прыжок','прыжка','прыжков'])}`,
   update(dt,el,tap){if(tap&&y>=0){vy=-12.5;tone(520,0,.08)}vy+=.6*dt/16;y=Math.min(0,y+vy*dt/16);if(y>=0)vy=0;
    spawn-=dt;if(spawn<=0){spawn=rnd(900,1500)-Math.min(500,el/60);obs.push({x:W+30,e:pick(['📦','🧶','🪴','🧸']),passed:false})}
    const sp=(4+el/9000)*dt/16;obs.forEach(o=>o.x-=sp);
    obs.forEach(o=>{if(!o.hit&&Math.abs(o.x-80)<30&&y>-36){o.hit=true;lives--;hurt=700;tone(160,0,.3,'square',.06)}if(!o.passed&&o.x<50){o.passed=true;if(!o.hit){st.score++;tone(700,0,.05,'triangle',.05)}}});
    obs=obs.filter(o=>o.x>-40);hurt-=dt;
    ctx.fillStyle=grad(ctx,H,'#9fd8ff','#e0f4ff');ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';[[60,80],[220,60],[300,120]].forEach(([x,yy])=>{const xx=(x-el/30)%420+420;ctx.beginPath();ctx.ellipse(xx%420-30,yy,30,12,0,0,7);ctx.fill()});
    ctx.fillStyle='#7cc35e';ctx.fillRect(0,G,W,H-G);ctx.fillStyle='#5aa33f';for(let i=0;i<W+40;i+=40)ctx.fillRect((i-el/8)%(W+40)+(i-el/8<0?W+40:0)-20,G,20,6);
    obs.forEach(o=>emo(ctx,o.e,o.x,G-18,36));
    if(!(hurt>0&&Math.floor(el/100)%2))drawCatImg(ctx,cat,80,G+4+y,76,y<0?-.2:0);
    return lives<=0||el>=DUR}}}};

async function catGame(key){screen='cg';stopTimer();const g=GAMES[key],C=CAT_GAMES[key];const stamp=Symbol();catGame.cur=stamp;
  app.innerHTML=`<section class="sheet"><div class="top">${backBtn()}<h2>${g.ic} ${g.title}</h2><span class="timer" id="cgS"></span></div><p class="hint">${C.rule}</p>
  <div class="draw"><canvas id="cgc" width="360" height="480" aria-label="Игровое поле" style="cursor:pointer"></canvas></div></section>`;
  $('#back').onclick=menu;
  const cat=await svgImage(catSVG(player.cat,'happy'));const cv=$('#cgc');if(!cv||catGame.cur!==stamp)return;const ctx=cv.getContext('2d');const W=360,H=480;
  const alive=()=>catGame.cur===stamp&&screen==='cg'&&document.body.contains(cv);
  const st={score:0};let tap=null;cv.onpointerdown=e=>{e.preventDefault();tap=evPoint(cv,e,W,H)};
  const game=GAME_IMPL[key](ctx,cat,W,H,st);let last=performance.now(),t0=last;
  function frame(now){if(!alive())return;const dt=Math.min(50,now-last);last=now;const fin=game.update(dt,now-t0,tap);tap=null;const l=$('#cgS');if(l)l.textContent=game.label();
    if(fin)return finish();requestAnimationFrame(frame)}
  requestAnimationFrame(frame);
  function finish(){screen='result';const s=st.score;const stars=game.stars(s);tick();applyEffects(C.eff);
    player.cat.energy=clamp(player.cat.energy-10,0,100);player.cat.food=clamp(player.cat.food-5,0,100);const info=record(key,stars,20+s*3,s,false);
    resultScreen(game.result(s),stars,s>0?'Котёнок в восторге!':'Котёнку всё равно понравилось',()=>start(key),info,
      `<p class="tag">${Object.entries(C.eff).map(([k,v])=>`${STAT_NAME[k]} +${v}`).join(' · ')} · Энергия −10</p>`)}}

/* ===== Дебаг-меню: 5 быстрых нажатий на заголовок или ссылка с #debug ===== */
let logoTaps=0,logoTimer;
$('#logo').onclick=()=>{logoTaps++;clearTimeout(logoTimer);logoTimer=setTimeout(()=>{if(logoTaps<5&&player)menu();logoTaps=0},450);
  if(logoTaps>=5){logoTaps=0;clearTimeout(logoTimer);debugMenu()}};
function debugMenu(confirmReset){const m=$('#modal');
  const p=player;const info=p?`${esc(p.nick)} · ★ ${wallet()} в кошельке · ${p.stars} всего · уровень ${lvlInfo(p.xp).l}`:'Игрок не выбран';
  m.innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-label="Дебаг-меню"><div class="modal" style="text-align:left">
  <h3>Дебаг-меню</h3><p class="note" style="margin:0 0 12px">${info}</p>
  ${confirmReset?`<p class="err" style="margin:0 0 10px">${confirmReset==='wipe'?'Удалить всех игроков и их прогресс на этом устройстве?':`Сбросить весь прогресс${p?` игрока ${esc(p.nick)}`:''}? Звёзды, уровень, котята, одежда и комната пропадут.`} Это нельзя отменить.</p>
    <div class="btns" style="justify-content:flex-start"><button class="btn" id="dbYes" style="background:var(--bad)">Да, сбросить</button><button class="btn alt" id="dbNo">Отмена</button></div>`:
  `<div class="btns" style="justify-content:flex-start;flex-direction:column;align-items:stretch">
    <button class="btn" id="db1000" ${p?'':'disabled'}>+1000 звёзд</button>
    <button class="btn alt" id="dbAll" ${p?'':'disabled'}>Открыть все вещи, котят и мебель</button>
    <button class="btn alt" id="dbLvl" ${p?'':'disabled'}>+1 уровень</button>
    <button class="btn alt" id="dbFeed" ${p?'':'disabled'}>Все шкалы 100% и разбудить</button>
    <button class="btn alt" id="dbPoop" ${p?'':'disabled'}>Добавить какашку</button>
    <button class="btn alt" id="dbEvNow" ${p?'':'disabled'}>Событие прямо сейчас (на главной)</button>
    <button class="btn alt" id="dbTour" ${p?'':'disabled'}>Сбросить попытку турнира</button>
    <p class="tag" style="margin:6px 0 0">Запустить ивент:</p><div class="row" style="margin:0">${Object.entries(EVENTS).map(([k,e])=>`<button class="btn alt small" data-ev="${k}" ${p?'':'disabled'} title="${e.name}">${e.icon}</button>`).join('')}</div>
    <button class="btn alt" id="dbRestart">Перезапуск</button>
    <button class="btn alt" id="dbReset" style="color:var(--bad);border-color:var(--bad)">Сброс прогресса</button>
    ${store.mode==='local'?'<button class="btn alt" id="dbWipe" style="color:var(--bad);border-color:var(--bad)">Удалить всех игроков на этом устройстве</button>':''}
    <button class="btn alt" id="dbClose">Закрыть</button></div>`}</div></div>`;
  const close=()=>{m.innerHTML=''};const on=(id,f)=>{const b=$('#'+id);if(b)b.onclick=f};
  const refresh=()=>{renderMe();if(screen==='cat')catScreen();else if(screen==='menu')menu()};
  on('dbClose',close);on('dbNo',()=>debugMenu());
  on('db1000',()=>{p.spent-=1000;savePlayer(true);refresh();toast('+1000 ★ в кошелёк');debugMenu()});
  on('dbAll',()=>{p.cat.owned=WEAR.map(x=>x.id);p.cat.skins=SKINS.map(x=>x.id);p.room.owned=[...FURN.map(x=>x.id),...WALLS.map(x=>x.id),...FLOORS.map(x=>x.id)];savePlayer(true);refresh();toast('Всё открыто');debugMenu()});
  on('dbLvl',()=>{const L=lvlInfo(p.xp);p.xp+=L.need-L.cur;savePlayer(true);refresh();toast(`Уровень ${lvlInfo(p.xp).l}`);debugMenu()});
  on('dbFeed',()=>{tick();Object.assign(p.cat,{food:100,joy:100,fun:100,sport:100,energy:100,sleepUntil:0,t:Date.now()});savePlayer(true);refresh();toast('Все шкалы 100%, котёнок проснулся');debugMenu()});
  on('dbPoop',()=>{p.cat.poops=Math.min(5,p.cat.poops+1);savePlayer(true);refresh();toast('Появилась какашка');debugMenu()});
  on('dbEvNow',()=>{p.nextEv=Date.now();savePlayer(true);refresh();toast('Событие готово');debugMenu()});
  on('dbTour',()=>{p.tDate='';savePlayer(true);refresh();toast('Попытка турнира снова доступна');debugMenu()});
  on('dbRestart',async()=>{close();stopTimer();clearTimeout(store.writeTimer);await store.writeQ;player=null;store.art=undefined;app.innerHTML='<p class="empty">Перезапускаем…</p>';
    await initStore();renderMe();player?menu():login();toast('Перезапущено')});
  on('dbReset',()=>debugMenu('reset'));
  on('dbYes',async()=>{if(confirmReset==='wipe')return wipe();close();stopTimer();
    if(p){const fresh=newPlayer(p.nick);player=fresh;store.art=null;
      if(store.mode==='online'){try{await store.db.doc('players/'+store.uid).set({...fresh,updated:Date.now()});await store.db.doc('players/'+store.uid+'/art/main').delete()}catch(e){}}
      else{saveLocal();LS.set('ut2_art:'+nickKey(p.nick),null)}
      renderMe();menu();toast('Прогресс сброшен')}
    else{renderMe();login()}});
  on('dbWipe',()=>debugMenu('wipe'));
  const wipe=()=>{const all=localPlayers();Object.keys(all).forEach(k=>LS.set('ut2_art:'+k,null));LS.set('ut2_players',{});LS.set('ut2_current',null);
    player=null;store.art=undefined;close();renderMe();login();toast('Все игроки удалены')};
  m.querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>{close();startEvent(b.dataset.ev)});
  const first=m.querySelector('button:not([disabled])');if(first)first.focus()}
if(location.hash==='#debug')setTimeout(debugMenu,300);
